[package]
name = "turretcam-app"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "turretcam"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
eframe = "0.37.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
turretcam-core = { version = "0.1.0", path = "../turretcam-core" }
